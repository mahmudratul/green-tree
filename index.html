<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Green Earth</title>

    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="style.css">

</head>

<body class="bg-green-50">
    <!-- nav bar section  -->

    <nav>

        <div class="navbar  bg-[#15803D] shadow-sm px-[30px]">
            <div class="navbar-start ">
                <div class="dropdown">
                    <div tabindex="0" role="button" class="btn btn-ghost lg:hidden">
                        <svg aria-label="Menu" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none"
                            viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M4 6h16M4 12h8m-8 6h16" />
                        </svg>
                    </div>
                    <ul tabindex="-1"
                        class="menu menu-sm dropdown-content bg-base-100 rounded-box z-1 mt-3 w-52 p-2 shadow text-green-800 font-bold">
                        <li><a>About</a></li>
                        <li><a>Gallery</a></li>
                        <li><a>Plant a tree</a></li>

                    </ul>
                </div>
                <a class="btn btn-ghost text-xl text-white font-bold">Green Tree</a>
            </div>
            <div class="navbar-center hidden lg:flex">
                <ul class="menu menu-horizontal px-1 text-white font-bold">
                    <li><a>About</a></li>
                    <li><a>Gallery</a></li>
                    <li><a>Plant a tree</a></li>

                </ul>
            </div>
            <!-- Right: button -->
            <div class="navbar-end">
                <a href=""
                    class="btn btn-sm bg-yellow-400 hover:bg-yellow-300 text-green-900 border-none rounded-full px-5">
                    Plant a Tree
                </a>
            </div>
        </div>
    </nav>

    <!-- overflow-hidden crops anything that sticks out of the section. 
   jodi leaf is boro  or wider hoy banner er theke tahole, the extra part  cut off hobe instead of spilling onto the next section. -->

    <section class="relative overflow-hidden bg-green-100">
        <!-- ekhane section ta relative thakbe karon eta parent ar etar vitor ja thakbe segula obsulate thakbe  -->

        <!-- Left leaf (hidden on mobile) -->
        <img src="./assets/hero-leaf1.png" alt=""
            class="hidden md:block absolute left-0 bottom-0 h-full max-h-80 object-contain pointer-events-none" />
        <!-- object-contain	Keeps the image's proportions, jate eta stretched or squashed na hoy
     Button not clickable hobe na: pointer-events-none.-->

        <!-- Right leaf -->
        <img src="./assets/hero-leaf2.png" alt=""
            class="hidden md:block absolute right-0 bottom-0 h-full max-h-80 object-contain pointer-events-none" />

        <!-- Content text-->
        <div class="relative max-w-2xl mx-auto text-center px-4 py-16 md:py-24">
            <!-- max-w-2xl limits the width to 42rem (672px). That keeps the subtitle from stretching across the whole screen.  -->
            <!-- mx-auto means left and right margins are automatic, which centers the block horizontally. -->

            <h1 class="text-3xl md:text-4xl font-bold text-slate-800">
                Plant a Tree, Grow a Future
            </h1>
            <p class="mt-4 text-sm md:text-base text-slate-600">
                Join our mission to plant 1 million trees and make the Earth greener for future generations.
            </p>
            <a href="#plant"
                class="btn mt-6 bg-yellow-400 hover:bg-yellow-300 text-green-900 border-none rounded-full px-6">
                Get Involved
            </a>
        </div>

    </section>



</body>

</html>
